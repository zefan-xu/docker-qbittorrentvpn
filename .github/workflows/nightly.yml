name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
      timezone: America/Los_Angeles

permissions:
  contents: read
  packages: write

jobs:
  preflight:
    name: preflight-full-test-suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Verify Docker and TUN support
        run: |
          set -euxo pipefail
          docker version
          docker buildx version
          if [ ! -c /dev/net/tun ]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200 || true
            sudo chmod 666 /dev/net/tun
          fi
          test -c /dev/net/tun
      - name: Static test guard
        run: bash tests/lint/no-shallow-assertions.sh
      - uses: docker/setup-buildx-action@v4
      - name: Build amd64 image for nightly tests
        run: docker buildx build --platform linux/amd64 --load -t qbtvpn:ci .
      - name: Run all smoke tests
        env:
          ARTIFACT_DIR: tests/smoke/tmp/artifacts-nightly-all
        run: bash tests/smoke/run.sh all
      - name: Run all integration tests
        env:
          ARTIFACT_DIR: tests/integration/tmp/artifacts-nightly-all
        run: bash tests/integration/run.sh all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-preflight-artifacts
          path: |
            tests/smoke/tmp/artifacts-*
            tests/integration/tmp/artifacts-*
          if-no-files-found: ignore

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ghcr.io/zefan-xu/docker-qbittorrentvpn
            benjaminxzf/docker-qbittorrentvpn
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/zefan-xu/docker-qbittorrentvpn
            org.opencontainers.image.licenses=GPL-3.0
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  registry-smoke:
    name: registry-smoke
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify published latest manifests
        run: |
          set -euo pipefail
          for image in \
            "ghcr.io/zefan-xu/docker-qbittorrentvpn:latest" \
            "benjaminxzf/docker-qbittorrentvpn:latest"; do
            safe_name=$(printf '%s' "$image" | tr '/:.' '---')
            docker buildx imagetools inspect "$image" | tee "manifest-${safe_name}.txt"
            grep -F 'linux/amd64' "manifest-${safe_name}.txt"
            grep -F 'linux/arm64' "manifest-${safe_name}.txt"
          done
      - name: Pull latest images and run smoke
        run: |
          set -euo pipefail
          for image in \
            "ghcr.io/zefan-xu/docker-qbittorrentvpn:latest" \
            "benjaminxzf/docker-qbittorrentvpn:latest"; do
            safe_name=$(printf '%s' "$image" | tr '/:.' '---')
            docker pull "$image"
            ARTIFACT_DIR="tests/smoke/tmp/artifacts-nightly-registry-smoke-${safe_name}" \
              IMAGE="$image" \
              bash tests/smoke/run.sh smoke-http-vpn-disabled
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-registry-smoke-artifacts
          path: tests/smoke/tmp/artifacts-nightly-registry-smoke-*
          if-no-files-found: ignore
