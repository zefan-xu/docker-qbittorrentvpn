name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read
  packages: write

jobs:
  preflight:
    name: preflight-full-test-suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Verify Docker and TUN support
        run: |
          set -euxo pipefail
          docker version
          docker buildx version
          if [ ! -c /dev/net/tun ]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200 || true
            sudo chmod 666 /dev/net/tun
          fi
          test -c /dev/net/tun
      - name: Static test guard
        run: bash tests/lint/no-shallow-assertions.sh
      - uses: docker/setup-buildx-action@v4
      - name: Build amd64 image for release tests
        run: docker buildx build --platform linux/amd64 --load -t qbtvpn:ci .
      - name: Run all smoke tests
        env:
          ARTIFACT_DIR: tests/smoke/tmp/artifacts-release-all
        run: bash tests/smoke/run.sh all
      - name: Run all integration tests
        env:
          ARTIFACT_DIR: tests/integration/tmp/artifacts-release-all
        run: bash tests/integration/run.sh all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-preflight-artifacts
          path: |
            tests/smoke/tmp/artifacts-*
            tests/integration/tmp/artifacts-*
          if-no-files-found: ignore

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/zefan-xu/docker-qbittorrentvpn
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/zefan-xu/docker-qbittorrentvpn
            org.opencontainers.image.licenses=GPL-3.0
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  registry-smoke:
    name: registry-smoke
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published manifest platforms
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            image="ghcr.io/zefan-xu/docker-qbittorrentvpn:${GITHUB_REF_NAME#v}"
          else
            image="ghcr.io/zefan-xu/docker-qbittorrentvpn:sha-${GITHUB_SHA}"
          fi
          docker buildx imagetools inspect "$image" | tee manifest.txt
          grep -F 'linux/amd64' manifest.txt
          grep -F 'linux/arm64' manifest.txt
      - name: Pull published image and run smoke
        env:
          ARTIFACT_DIR: tests/smoke/tmp/artifacts-registry-smoke
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            image="ghcr.io/zefan-xu/docker-qbittorrentvpn:${GITHUB_REF_NAME#v}"
          else
            image="ghcr.io/zefan-xu/docker-qbittorrentvpn:sha-${GITHUB_SHA}"
          fi
          docker pull "$image"
          IMAGE="$image" bash tests/smoke/run.sh smoke-http-vpn-disabled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-smoke-artifacts
          path: tests/smoke/tmp/artifacts-registry-smoke
          if-no-files-found: ignore
