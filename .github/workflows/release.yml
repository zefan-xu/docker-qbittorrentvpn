name: Release

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
      timezone: America/Los_Angeles
  push:
    tags:
      - v*

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      image_tag: ${{ steps.mode.outputs.image_tag }}
      release_tag: ${{ steps.mode.outputs.release_tag }}
      asset_suffix: ${{ steps.mode.outputs.asset_suffix }}
    steps:
      - id: mode
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            {
              echo "mode=versioned"
              echo "image_tag=${version}"
              echo "release_tag=${GITHUB_REF_NAME}"
              echo "asset_suffix=${version}"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            {
              echo "mode=rolling"
              echo "image_tag=latest"
              echo "release_tag=latest"
              echo "asset_suffix=latest"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Release workflow must run on main or a v* tag; got ${GITHUB_REF}" >&2
            exit 1
          fi

  preflight:
    name: preflight-full-test-suite
    runs-on: ubuntu-latest
    needs: classify
    outputs:
      qbt_version: ${{ steps.qbt-version.outputs.qbt_version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Verify Docker and TUN support
        run: |
          set -euxo pipefail
          docker version
          docker buildx version
          if [ ! -c /dev/net/tun ]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200 || true
            sudo chmod 666 /dev/net/tun
          fi
          test -c /dev/net/tun
      - name: Static test guard
        run: bash tests/lint/no-shallow-assertions.sh
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
      - name: Build amd64 image for release tests
        run: docker buildx build --platform linux/amd64 --load -t qbtvpn:ci .
      - name: Detect qBittorrent version
        id: qbt-version
        run: |
          set -euo pipefail
          version_output=$(docker run --rm --entrypoint qbittorrent-nox qbtvpn:ci --version)
          printf '%s\n' "$version_output"
          qbt_version=$(printf '%s\n' "$version_output" | sed -nE 's/.*([0-9]+[.][0-9]+[.][0-9]+).*/\1/p' | head -n 1)
          if [[ -z "$qbt_version" ]]; then
            echo "Could not detect qBittorrent X.Y.Z version from: ${version_output}" >&2
            exit 1
          fi
          echo "qbt_version=${qbt_version}" >> "$GITHUB_OUTPUT"
      - name: Run all smoke tests
        env:
          ARTIFACT_DIR: tests/smoke/tmp/artifacts-${{ needs.classify.outputs.mode }}-all
        run: bash tests/smoke/run.sh all
      - name: Run all integration tests
        env:
          ARTIFACT_DIR: tests/integration/tmp/artifacts-${{ needs.classify.outputs.mode }}-all
        run: bash tests/integration/run.sh all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: release-${{ needs.classify.outputs.mode }}-preflight-artifacts
          path: |
            tests/smoke/tmp/artifacts-*
            tests/integration/tmp/artifacts-*
          if-no-files-found: ignore

  resolve-release:
    name: resolve-release
    runs-on: ubuntu-latest
    needs:
      - classify
      - preflight
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      asset_suffix: ${{ steps.release.outputs.asset_suffix }}
      minor_tag: ${{ steps.release.outputs.minor_tag }}
      qbt_version: ${{ steps.release.outputs.qbt_version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - id: release
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          TAG_IMAGE: ${{ needs.classify.outputs.image_tag }}
          TAG_RELEASE: ${{ needs.classify.outputs.release_tag }}
          QBT_VERSION: ${{ needs.preflight.outputs.qbt_version }}
        run: |
          set -euo pipefail

          if [[ "$MODE" == versioned ]]; then
            image_tag="$TAG_IMAGE"
            release_tag="$TAG_RELEASE"
            asset_suffix="$image_tag"
            qbt_version=$(sed -nE 's/^([0-9]+[.][0-9]+[.][0-9]+).*/\1/p' <<< "$image_tag")
            if [[ -z "$qbt_version" ]]; then
              echo "Could not parse qBittorrent X.Y.Z version from tag ${TAG_RELEASE}" >&2
              exit 1
            fi
          elif [[ "$MODE" == rolling ]]; then
            if [[ -z "$QBT_VERSION" ]]; then
              echo "Missing qBittorrent version from preflight" >&2
              exit 1
            fi

            max_suffix=0
            tag_prefix="v${QBT_VERSION}-"
            while read -r _ ref; do
              tag="${ref#refs/tags/}"
              tag="${tag%\^\{\}}"
              suffix="${tag#"$tag_prefix"}"
              if [[ "$tag" == "$tag_prefix"* && "$suffix" =~ ^[0-9]+$ ]]; then
                suffix_num=$((10#$suffix))
                if (( suffix_num > max_suffix )); then
                  max_suffix="$suffix_num"
                fi
              fi
            done < <(git ls-remote --tags origin "refs/tags/v${QBT_VERSION}-*" || true)

            next_suffix=$((max_suffix + 1))
            image_tag="${QBT_VERSION}-${next_suffix}"
            release_tag="v${image_tag}"
            asset_suffix="$image_tag"
            qbt_version="$QBT_VERSION"
          else
            echo "Unsupported release mode: ${MODE}" >&2
            exit 1
          fi

          minor_tag=$(sed -nE 's/^([0-9]+[.][0-9]+)[.].*/\1/p' <<< "$qbt_version")
          if [[ -z "$minor_tag" ]]; then
            echo "Could not derive major/minor image tag from qBittorrent version ${qbt_version}" >&2
            exit 1
          fi

          {
            echo "image_tag=${image_tag}"
            echo "release_tag=${release_tag}"
            echo "asset_suffix=${asset_suffix}"
            echo "minor_tag=${minor_tag}"
            echo "qbt_version=${qbt_version}"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs:
      - classify
      - resolve-release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute image metadata
        id: meta
        env:
          IMAGE_TAG: ${{ needs.resolve-release.outputs.image_tag }}
          MINOR_TAG: ${{ needs.resolve-release.outputs.minor_tag }}
          MODE: ${{ needs.classify.outputs.mode }}
        run: |
          set -euo pipefail
          images=(
            "ghcr.io/zefan-xu/docker-qbittorrentvpn"
            "benjaminxzf/docker-qbittorrentvpn"
          )
          release_tags=()
          if [[ "$MODE" == rolling ]]; then
            release_tags+=("latest")
          fi
          release_tags+=("$IMAGE_TAG")
          release_tags+=("$MINOR_TAG")
          release_tags+=("sha-${GITHUB_SHA}")

          {
            echo "tags<<EOF"
            for image in "${images[@]}"; do
              for tag in "${release_tags[@]}"; do
                echo "${image}:${tag}"
              done
            done
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=https://github.com/zefan-xu/docker-qbittorrentvpn"
            echo "org.opencontainers.image.licenses=GPL-3.0"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  registry-smoke:
    name: registry-smoke
    runs-on: ubuntu-latest
    needs:
      - classify
      - publish
      - resolve-release
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify published manifest platforms
        env:
          IMAGE_TAG: ${{ needs.resolve-release.outputs.image_tag }}
          MINOR_TAG: ${{ needs.resolve-release.outputs.minor_tag }}
          MODE: ${{ needs.classify.outputs.mode }}
        run: |
          set -euo pipefail
          tags=()
          if [[ "$MODE" == rolling ]]; then
            tags+=("latest")
          fi
          tags+=("$IMAGE_TAG")
          tags+=("$MINOR_TAG")
          tags+=("sha-${GITHUB_SHA}")

          for tag in "${tags[@]}"; do
            for image in \
              "ghcr.io/zefan-xu/docker-qbittorrentvpn:${tag}" \
              "benjaminxzf/docker-qbittorrentvpn:${tag}"; do
              safe_name=$(printf '%s' "$image" | tr '/:.' '---')
              docker buildx imagetools inspect "$image" | tee "manifest-${safe_name}.txt"
              grep -F 'linux/amd64' "manifest-${safe_name}.txt"
              grep -F 'linux/arm64' "manifest-${safe_name}.txt"
            done
          done
      - name: Pull published image and run smoke
        env:
          IMAGE_TAG: ${{ needs.resolve-release.outputs.image_tag }}
          MODE: ${{ needs.classify.outputs.mode }}
        run: |
          set -euo pipefail
          smoke_tags=("$IMAGE_TAG")
          if [[ "$MODE" == rolling ]]; then
            smoke_tags=("latest" "$IMAGE_TAG")
          fi

          for tag in "${smoke_tags[@]}"; do
            for image in \
              "ghcr.io/zefan-xu/docker-qbittorrentvpn:${tag}" \
              "benjaminxzf/docker-qbittorrentvpn:${tag}"; do
              safe_name=$(printf '%s' "$image" | tr '/:.' '---')
              docker pull "$image"
              ARTIFACT_DIR="tests/smoke/tmp/artifacts-registry-smoke-${safe_name}" \
                IMAGE="$image" \
                bash tests/smoke/run.sh smoke-http-vpn-disabled
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: release-${{ needs.classify.outputs.mode }}-registry-smoke-artifacts
          path: tests/smoke/tmp/artifacts-registry-smoke-*
          if-no-files-found: ignore

  github-release:
    name: github-release
    runs-on: ubuntu-latest
    needs:
      - classify
      - registry-smoke
      - resolve-release
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install release tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo zstd
      - name: Export images and write release notes
        env:
          IMAGE_TAG: ${{ needs.resolve-release.outputs.image_tag }}
          MINOR_TAG: ${{ needs.resolve-release.outputs.minor_tag }}
          MODE: ${{ needs.classify.outputs.mode }}
          QBT_VERSION: ${{ needs.resolve-release.outputs.qbt_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist

          sha_tag="sha-${GITHUB_SHA}"
          inspect_image() {
            local label="$1"
            local image="$2"
            echo "${label}:"
            docker buildx imagetools inspect "$image"
            echo
          }

          write_release_files() {
            local primary_tag="$1"
            local asset_suffix="$2"
            local ghcr_image="ghcr.io/zefan-xu/docker-qbittorrentvpn:${primary_tag}"
            local dockerhub_image="benjaminxzf/docker-qbittorrentvpn:${primary_tag}"
            local archive="dist/docker-qbittorrentvpn-${asset_suffix}.oci.tar"
            local compressed="${archive}.zst"
            local digest_file="dist/image-digests-${asset_suffix}.txt"
            local notes_file="dist/RELEASE_NOTES-${asset_suffix}.md"
            local heading
            local release_sentence
            local archive_sentence

            skopeo copy --all "docker://${ghcr_image}" "oci-archive:${archive}"
            zstd -T0 -6 --rm "$archive"
            sha256sum "$compressed" | tee "${compressed}.sha256"

            {
              inspect_image "GHCR primary image" "$ghcr_image"
              inspect_image "Docker Hub primary image" "$dockerhub_image"
              if [[ "$MODE" == rolling ]]; then
                inspect_image "GHCR rolling latest image" "ghcr.io/zefan-xu/docker-qbittorrentvpn:latest"
                inspect_image "Docker Hub rolling latest image" "benjaminxzf/docker-qbittorrentvpn:latest"
              fi
              if [[ "$primary_tag" != "$IMAGE_TAG" ]]; then
                inspect_image "GHCR immutable version image" "ghcr.io/zefan-xu/docker-qbittorrentvpn:${IMAGE_TAG}"
                inspect_image "Docker Hub immutable version image" "benjaminxzf/docker-qbittorrentvpn:${IMAGE_TAG}"
              fi
              if [[ -n "$MINOR_TAG" && "$primary_tag" != "$MINOR_TAG" ]]; then
                inspect_image "GHCR major/minor image" "ghcr.io/zefan-xu/docker-qbittorrentvpn:${MINOR_TAG}"
                inspect_image "Docker Hub major/minor image" "benjaminxzf/docker-qbittorrentvpn:${MINOR_TAG}"
              fi
              inspect_image "GHCR immutable SHA image" "ghcr.io/zefan-xu/docker-qbittorrentvpn:${sha_tag}"
              inspect_image "Docker Hub immutable SHA image" "benjaminxzf/docker-qbittorrentvpn:${sha_tag}"
            } | tee "$digest_file"

            heading="Container Images"
            release_sentence="This versioned release passed the full release gate: smoke tests, integration tests,"
            release_sentence+=" registry manifest checks, and registry smoke tests for GHCR and Docker Hub."
            if [[ "$MODE" == rolling ]]; then
              release_sentence+=" The same run updated the Docker latest tags in GHCR and Docker Hub."
            fi
            archive_sentence="The attached OCI archive contains the same multi-arch versioned image exported from GHCR after registry smoke passed."

            {
              echo "## ${heading}"
              echo
              echo '```sh'
              if [[ "$MODE" == rolling ]]; then
                echo "docker pull benjaminxzf/docker-qbittorrentvpn:latest"
                echo "docker pull ghcr.io/zefan-xu/docker-qbittorrentvpn:latest"
              fi
              echo "docker pull ${dockerhub_image}"
              echo "docker pull ${ghcr_image}"
              if [[ "$primary_tag" != "$IMAGE_TAG" ]]; then
                echo "docker pull benjaminxzf/docker-qbittorrentvpn:${IMAGE_TAG}"
                echo "docker pull ghcr.io/zefan-xu/docker-qbittorrentvpn:${IMAGE_TAG}"
              fi
              if [[ -n "$MINOR_TAG" && "$primary_tag" != "$MINOR_TAG" ]]; then
                echo "docker pull benjaminxzf/docker-qbittorrentvpn:${MINOR_TAG}"
                echo "docker pull ghcr.io/zefan-xu/docker-qbittorrentvpn:${MINOR_TAG}"
              fi
              echo "docker pull benjaminxzf/docker-qbittorrentvpn:${sha_tag}"
              echo "docker pull ghcr.io/zefan-xu/docker-qbittorrentvpn:${sha_tag}"
              echo '```'
              echo
              echo "Supported platforms: \`linux/amd64\`, \`linux/arm64\`."
              echo
              echo "qBittorrent version: \`${QBT_VERSION}\`"
              echo "Source commit: \`${GITHUB_SHA}\`"
              echo "Workflow run: ${RUN_URL}"
              echo
              echo "$release_sentence"
              echo
              echo "$archive_sentence"
              echo
              echo "Archive asset: \`$(basename "$compressed")\`"
              echo "Checksum asset: \`$(basename "${compressed}.sha256")\`"
              echo "Digest asset: \`$(basename "$digest_file")\`"
            } > "$notes_file"
          }

          write_release_files "$IMAGE_TAG" "$IMAGE_TAG"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_SUFFIX: ${{ needs.resolve-release.outputs.asset_suffix }}
          MODE: ${{ needs.classify.outputs.mode }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        run: |
          set -euo pipefail

          upsert_release() {
            local release_tag="$1"
            local asset_suffix="$2"
            local notes_file="dist/RELEASE_NOTES-${asset_suffix}.md"
            local assets=(
              "dist/docker-qbittorrentvpn-${asset_suffix}.oci.tar.zst"
              "dist/docker-qbittorrentvpn-${asset_suffix}.oci.tar.zst.sha256"
              "dist/image-digests-${asset_suffix}.txt"
            )

            if gh release view "$release_tag" >/dev/null 2>&1; then
              gh release edit "$release_tag" --title "$release_tag" --notes-file "$notes_file" --latest
              gh release upload "$release_tag" "${assets[@]}" --clobber
            elif [[ "$MODE" == versioned ]]; then
              gh release create "$release_tag" "${assets[@]}" --title "$release_tag" --notes-file "$notes_file" --latest --verify-tag
            else
              gh release create "$release_tag" "${assets[@]}" --title "$release_tag" --notes-file "$notes_file" --latest --target "$GITHUB_SHA"
            fi
          }

          upsert_release "$RELEASE_TAG" "$ASSET_SUFFIX"
